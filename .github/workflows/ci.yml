name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The corpus contains AST-backed cases. Without Python the scanner
      # falls back to proximity and those four cases are skipped, so install
      # it to keep the pinned expectations fully enforced.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm test
      - name: Baseline gate
        run: node scripts/gate.js
