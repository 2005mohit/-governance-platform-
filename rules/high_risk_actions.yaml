
# Rules in eu_ai_act.yaml (and future packs, e.g. an India pack) reference
# this list via `actionsRef: high_risk_actions` instead of duplicating it.
# To extend coverage, add a verb here — no scanner.js change needed, and
# every rule referencing the list picks it up on the next run.
#
# Each entry documents WHY the verb is high-risk, so auditors can review the
# taxonomy without reading code. Keep entries action-shaped (function-call
# names), not prose: they are interpolated into the scanner's call-matching
# regex, so avoid regex metacharacters unless you mean them.
actions:
  - name: "delete"
    why: "Irreversible data destruction; the canonical destructive action."
  - name: "drop_table"
    why: "Bulk irreversible schema/data destruction."
  - name: "transfer"
    why: "Moves assets or data custody; hard to unwind once executed."
  - name: "wire_transfer"
    why: "Irreversible movement of funds to an external party."
  - name: "fire"
    why: "Employment termination; consequential decision about a person."
  - name: "terminate"
    why: "Ends processes, contracts, or instances; often irreversible."
  - name: "deny_loan"
    why: "Consequential financial decision about a person."
  - name: "medical_diagnosis"
    why: "Health decision with direct safety consequences."
  - name: "send_payment"
    why: "Irreversible disbursement of funds."
